
name: Jupyter Book GitHub Pages Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  BASE_URL: /${{ github.event.repository.name }}

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Jupyter Book
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      - name: Install Jupyter Book
        run: npm install -g jupyter-book

      - name: Build website
        run: jupyter-book build --html

      - name: Verify generated website
        run: test -f ./_build/html/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_build/html

  deploy:
    name: Deploy Jupyter Book
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Verify artifact availability
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          for attempt in {1..12}; do
            count=$(gh api \
              "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
              --jq '[.artifacts[] | select(.name == "github-pages")] | length')

            echo "Artifact check $attempt: found $count"

            if [ "$count" -eq 1 ]; then
              echo "Pages artifact is available."
              exit 0
            fi

            if [ "$count" -gt 1 ]; then
              echo "::error::Multiple Pages artifacts found."
              exit 1
            fi

            sleep 5
          done

          echo "::error::Pages artifact not visible to GitHub API."
          exit 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
